definitions:
  handler.ChatMessage:
    properties:
      content:
        example: Please summarize this article
        type: string
      role:
        example: user
        type: string
    type: object
  handler.ChatRequest:
    properties:
      max_tokens:
        example: 512
        type: integer
      message:
        example: Generate three blog titles
        type: string
      messages:
        items:
          $ref: '#/definitions/handler.ChatMessage'
        type: array
      model:
        example: deepseek-chat
        type: string
      system:
        example: You are a helpful writing assistant
        type: string
      temperature:
        example: 0.7
        type: number
    type: object
  handler.GitHubRepo:
    properties:
      created_at:
        type: string
      description:
        type: string
      fork:
        type: boolean
      forks_count:
        type: integer
      full_name:
        type: string
      homepage:
        type: string
      html_url:
        type: string
      id:
        type: integer
      language:
        type: string
      name:
        type: string
      open_issues_count:
        type: integer
      private:
        type: boolean
      pushed_at:
        type: string
      stargazers_count:
        type: integer
      topics:
        items:
          type: string
        type: array
      updated_at:
        type: string
      watchers_count:
        type: integer
    type: object
  models.AuthCredentials:
    properties:
      account:
        type: string
      email:
        type: string
      password:
        type: string
    type: object
  models.AuthResponse:
    properties:
      is_owner:
        type: boolean
      token:
        type: string
      user:
        $ref: '#/definitions/models.User'
    type: object
  models.Blog:
    properties:
      category_id:
        type: integer
      category_name:
        description: 查询时填充
        type: string
      created_at:
        $ref: '#/definitions/models.CustomTime'
      description:
        type: string
      id:
        type: integer
      title:
        type: string
      updated_at:
        $ref: '#/definitions/models.CustomTime'
      url:
        type: string
    type: object
  models.Category:
    properties:
      children:
        description: 子分类列表，查询时填充
        items:
          $ref: '#/definitions/models.Category'
        type: array
      created_at:
        $ref: '#/definitions/models.CustomTime'
      description:
        description: 分类描述
        type: string
      id:
        type: integer
      img_url:
        description: 分类封面图片URL
        type: string
      name:
        type: string
      parent_id:
        description: nil表示顶级分类
        type: integer
      sort_order:
        type: integer
      tags:
        description: 分类标签
        items:
          type: string
        type: array
      type:
        description: folder=文件夹, article=文章
        type: string
      updated_at:
        $ref: '#/definitions/models.CustomTime'
      url:
        description: 文章类型时存储文章地址
        type: string
    type: object
  models.CreateCommentRequest:
    properties:
      article_id:
        description: 文章ID
        example: 11
        type: integer
      avatar_url:
        description: 评论者头像（可选）
        example: https://example.com/avatar.jpg
        type: string
      content:
        description: 评论内容
        example: 写得很好！
        type: string
      email:
        description: 评论者邮箱（可选）
        example: zhangsan@example.com
        type: string
      nickname:
        description: 评论者昵称
        example: 张三
        type: string
      parent_id:
        description: 父评论ID（可选）
        example: 101
        type: integer
    type: object
  models.CustomTime:
    properties:
      time.Time:
        type: string
    type: object
  models.GuestRecord:
    properties:
      content:
        type: string
      created_at:
        $ref: '#/definitions/models.CustomTime'
      entry_time:
        $ref: '#/definitions/models.CustomTime'
      id:
        type: integer
    required:
    - content
    - entry_time
    type: object
  models.RegisterRequest:
    properties:
      account:
        type: string
      birthday:
        type: string
      email:
        type: string
      name:
        type: string
      nickname:
        type: string
      password:
        type: string
    type: object
  models.User:
    properties:
      account:
        type: string
      avatar_url:
        description: GitHub 头像 URL
        type: string
      birthday:
        type: string
      email:
        type: string
      github_id:
        description: GitHub 用户 ID
        type: integer
      github_url:
        description: GitHub 主页 URL
        type: string
      id:
        type: integer
      name:
        type: string
      nickname:
        type: string
      password:
        type: string
    type: object
  models.VisitLog:
    properties:
      content:
        type: string
      created_at:
        $ref: '#/definitions/models.CustomTime'
      id:
        type: integer
      user_nickname:
        type: string
      visit_time:
        $ref: '#/definitions/models.CustomTime'
    required:
    - visit_time
    type: object
  repository.HotTag:
    properties:
      count:
        type: integer
      name:
        type: string
    type: object
  response.APIResponse:
    properties:
      code:
        type: integer
      data: {}
      msg:
        type: string
      page:
        type: integer
      total:
        type: integer
    type: object
info:
  contact: {}
paths:
  /ai/chat:
    post:
      consumes:
      - application/json
      description: Proxy a DeepSeek Chat Completions request without exposing the
        API key to the frontend.
      parameters:
      - description: Chat request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.ChatRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.APIResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/response.APIResponse'
        "500":
          description: Server error
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - ApiKeyAuth: []
      summary: Proxy DeepSeek chat
      tags:
      - ai
  /auth/github:
    get:
      description: 返回 GitHub OAuth 授权页面的 URL
      produces:
      - application/json
      responses:
        "200":
          description: '{"url": "..."}'
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 获取 GitHub 登录 URL
      tags:
      - auth
  /auth/github/callback:
    get:
      description: 处理 GitHub OAuth 回调，获取用户信息并登录/注册
      parameters:
      - description: GitHub 授权码
        in: query
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: '{"token": "...", "user": {...}}'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 缺少授权码
          schema:
            type: string
        "500":
          description: 获取 token 失败
          schema:
            type: string
      summary: GitHub OAuth 回调
      tags:
      - auth
  /auth/github/login:
    post:
      consumes:
      - application/json
      description: 前端传递 GitHub 授权码，后端处理登录/注册
      parameters:
      - description: 包含 code 的请求体
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: '{"token": "...", "user": {...}}'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 无效的请求体
          schema:
            type: string
        "500":
          description: 获取 token 失败
          schema:
            type: string
      summary: 使用授权码进行 GitHub 登录
      tags:
      - auth
  /auth/verify:
    get:
      description: 验证 JWT Token 是否有效，并返回当前用户信息
      parameters:
      - description: Bearer Token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  type: object
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.APIResponse'
      summary: 验证 Token
      tags:
      - auth
  /blogs:
    get:
      description: 根据分类ID分页获取博客列表，支持关键词搜索。
      parameters:
      - description: 分类ID
        in: query
        name: category_id
        type: integer
      - description: 搜索关键词
        in: query
        name: keyword
        type: string
      - description: 页码，默认1
        in: query
        name: page
        type: integer
      - description: 每页数量，默认10
        in: query
        name: pagesize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.Blog'
                  type: array
              type: object
        "500":
          description: 查询失败
          schema:
            $ref: '#/definitions/response.APIResponse'
      summary: 获取博客列表
      tags:
      - blogs
  /blogs/{id}:
    get:
      description: 根据ID获取单个博客的详细信息。
      parameters:
      - description: 博客ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.Blog'
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/response.APIResponse'
        "404":
          description: 博客不存在
          schema:
            $ref: '#/definitions/response.APIResponse'
        "500":
          description: 查询失败
          schema:
            $ref: '#/definitions/response.APIResponse'
      summary: 获取博客详情
      tags:
      - blogs
  /categories:
    get:
      description: List categories with optional tree mode and pagination.
      parameters:
      - description: Return tree structure, default true
        in: query
        name: tree
        type: boolean
      - description: Parent category ID
        in: query
        name: parent_id
        type: integer
      - description: 'Category type filter: folder or article'
        in: query
        name: type
        type: string
      - description: Category name keyword
        in: query
        name: keyword
        type: string
      - description: Page number starting from 1
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.Category'
                  type: array
              type: object
        "500":
          description: Query failed
          schema:
            $ref: '#/definitions/response.APIResponse'
      summary: List categories
      tags:
      - categories
    post:
      consumes:
      - application/json
      description: Create a new category or nested child category.
      parameters:
      - description: Category payload
        in: body
        name: category
        required: true
        schema:
          $ref: '#/definitions/models.Category'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.Category'
              type: object
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/response.APIResponse'
        "500":
          description: Create failed
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - ApiKeyAuth: []
      summary: Create category
      tags:
      - categories
  /categories/{id}:
    delete:
      description: Delete a category and its descendants.
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.APIResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/response.APIResponse'
        "404":
          description: Category not found
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - ApiKeyAuth: []
      summary: Delete category
      tags:
      - categories
    get:
      description: Get a category and its nested children by ID.
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.Category'
              type: object
        "400":
          description: Invalid ID
          schema:
            $ref: '#/definitions/response.APIResponse'
        "404":
          description: Category not found
          schema:
            $ref: '#/definitions/response.APIResponse'
      summary: Get category detail
      tags:
      - categories
    put:
      consumes:
      - application/json
      description: Update category fields.
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: integer
      - description: Category payload
        in: body
        name: category
        required: true
        schema:
          $ref: '#/definitions/models.Category'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.Category'
              type: object
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/response.APIResponse'
        "404":
          description: Category not found
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - ApiKeyAuth: []
      summary: Update category
      tags:
      - categories
  /categories/hot-tags:
    get:
      description: Get the most frequently used tags.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/repository.HotTag'
                  type: array
              type: object
        "500":
          description: Query failed
          schema:
            $ref: '#/definitions/response.APIResponse'
      summary: Get hot tags
      tags:
      - categories
  /comments:
    get:
      description: Get paginated root comments and nested replies for an article.
      parameters:
      - description: Article ID
        in: query
        name: article_id
        required: true
        type: integer
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.APIResponse'
      summary: List article comments
      tags:
      - comments
    post:
      consumes:
      - application/json
      description: Create a comment or reply for an article.
      parameters:
      - description: Comment payload
        in: body
        name: comment
        required: true
        schema:
          $ref: '#/definitions/models.CreateCommentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - ApiKeyAuth: []
      summary: Create comment
      tags:
      - comments
  /comments/{id}:
    delete:
      description: Delete a comment by ID.
      parameters:
      - description: Comment ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - ApiKeyAuth: []
      summary: Delete comment
      tags:
      - comments
  /github/repos:
    get:
      description: 获取博主 GitHub 账号下的所有公开仓库
      parameters:
      - default: updated
        description: '排序方式: created, updated, pushed, full_name'
        in: query
        name: sort
        type: string
      - default: 30
        description: 每页数量
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/handler.GitHubRepo'
                  type: array
              type: object
      summary: 获取博主的 GitHub 开源项目
      tags:
      - github
  /guest:
    post:
      consumes:
      - application/json
      description: Record a guest entry event.
      parameters:
      - description: Guest record payload
        in: body
        name: record
        required: true
        schema:
          $ref: '#/definitions/models.GuestRecord'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.GuestRecord'
              type: object
      summary: Create guest record
      tags:
      - guest
  /login:
    post:
      consumes:
      - application/json
      description: 使用用户名或邮箱和密码登录，返回 JWT 令牌和用户信息
      parameters:
      - description: 登录凭证
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/models.AuthCredentials'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.AuthResponse'
        "400":
          description: 无效的请求体
          schema:
            type: string
        "401":
          description: 账号或密码错误
          schema:
            type: string
      summary: 用户登录
      tags:
      - auth
  /owner/today-visits:
    get:
      description: Get today's visit count for the owner.
      parameters:
      - description: Bearer Token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  type: object
              type: object
      security:
      - ApiKeyAuth: []
      summary: Get owner today visits
      tags:
      - owner
  /owner/visits:
    get:
      description: Get visit stats for the owner over the last N days.
      parameters:
      - description: Number of days, default 7
        in: query
        name: days
        type: integer
      - description: Bearer Token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  type: object
              type: object
      security:
      - ApiKeyAuth: []
      summary: Get owner visit stats
      tags:
      - owner
  /register:
    post:
      consumes:
      - application/json
      description: 使用邮箱、用户名和密码注册，注册成功后直接返回 JWT 令牌
      parameters:
      - description: 注册信息
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/models.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.AuthResponse'
        "400":
          description: 无效的请求体
          schema:
            type: string
        "409":
          description: 邮箱或用户名已存在
          schema:
            type: string
      summary: 用户注册
      tags:
      - auth
  /upload:
    post:
      consumes:
      - multipart/form-data
      description: Upload an image to the remote image host and forward its response.
      parameters:
      - description: Image file
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: object
            type: array
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/response.APIResponse'
        "500":
          description: Upload failed
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - ApiKeyAuth: []
      summary: Proxy image upload
      tags:
      - upload
  /users:
    get:
      description: 获取所有已注册用户的列表。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.User'
            type: array
        "500":
          description: 查询失败或数据解析失败
          schema:
            type: string
      summary: 获取所有用户
      tags:
      - users
    post:
      consumes:
      - application/json
      description: 在系统中创建一个新用户。此操作需要身份验证。
      parameters:
      - description: 要添加的用户
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/models.User'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.User'
        "400":
          description: 无效的请求体
          schema:
            type: string
        "500":
          description: 准备或执行语句失败
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: 添加一个新用户
      tags:
      - users
  /visits:
    get:
      description: Get paginated visit logs.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.VisitLog'
                  type: array
              type: object
      summary: List visit logs
      tags:
      - visits
    post:
      consumes:
      - application/json
      description: Record a user visit.
      parameters:
      - description: Visit payload
        in: body
        name: visit
        required: true
        schema:
          $ref: '#/definitions/models.VisitLog'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.VisitLog'
              type: object
      summary: Create visit log
      tags:
      - visits
swagger: "2.0"
