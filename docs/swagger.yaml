definitions:
  handler.ChatMessage:
    properties:
      content:
        example: Please summarize this article
        type: string
      role:
        example: user
        type: string
    type: object
  handler.ChatRequest:
    properties:
      max_tokens:
        example: 512
        type: integer
      message:
        example: Generate three blog titles
        type: string
      messages:
        items:
          $ref: '#/definitions/handler.ChatMessage'
        type: array
      model:
        example: deepseek-chat
        type: string
      system:
        example: You are a helpful writing assistant
        type: string
      temperature:
        example: 0.7
        type: number
    type: object
  handler.GitHubRepo:
    properties:
      created_at:
        type: string
      description:
        type: string
      fork:
        type: boolean
      forks_count:
        type: integer
      full_name:
        type: string
      homepage:
        type: string
      html_url:
        type: string
      id:
        type: integer
      language:
        type: string
      name:
        type: string
      open_issues_count:
        type: integer
      private:
        type: boolean
      pushed_at:
        type: string
      stargazers_count:
        type: integer
      topics:
        items:
          type: string
        type: array
      updated_at:
        type: string
      watchers_count:
        type: integer
    type: object
  models.AuthCredentials:
    properties:
      account:
        type: string
      email:
        type: string
      password:
        type: string
    type: object
  models.AuthResponse:
    properties:
      is_owner:
        type: boolean
      token:
        type: string
      user:
        $ref: '#/definitions/models.User'
    type: object
  models.Blog:
    properties:
      category_id:
        type: integer
      category_name:
        description: Parent category name, populated on reads.
        type: string
      created_at:
        $ref: '#/definitions/models.CustomTime'
      description:
        type: string
      id:
        type: integer
      title:
        type: string
      updated_at:
        $ref: '#/definitions/models.CustomTime'
      url:
        type: string
    type: object
  models.Category:
    properties:
      children:
        description: Nested child categories, populated on reads.
        items:
          $ref: '#/definitions/models.Category'
        type: array
      created_at:
        $ref: '#/definitions/models.CustomTime'
      description:
        description: Optional summary text.
        type: string
      id:
        type: integer
      img_url:
        description: Cover image URL.
        type: string
      name:
        type: string
      parent_id:
        description: Nil means a top-level category.
        type: integer
      sort_order:
        type: integer
      tags:
        description: Optional tag list.
        items:
          type: string
        type: array
      type:
        description: folder for navigation, article for content nodes.
        type: string
      updated_at:
        $ref: '#/definitions/models.CustomTime'
      url:
        description: Article URL when Type is article.
        type: string
    type: object
  models.CreateCommentRequest:
    properties:
      article_id:
        description: Article node ID.
        example: 11
        type: integer
      avatar_url:
        description: Optional avatar URL.
        example: https://example.com/avatar.jpg
        type: string
      content:
        description: Comment body.
        example: Great article!
        type: string
      email:
        description: Optional contact email.
        example: alex@example.com
        type: string
      nickname:
        description: Comment author nickname.
        example: Alex
        type: string
      parent_id:
        description: Optional parent comment ID.
        example: 101
        type: integer
    type: object
  models.CustomTime:
    properties:
      time.Time:
        type: string
    type: object
  models.GuestRecord:
    properties:
      content:
        type: string
      created_at:
        $ref: '#/definitions/models.CustomTime'
      entry_time:
        $ref: '#/definitions/models.CustomTime'
      id:
        type: integer
    required:
    - content
    - entry_time
    type: object
  models.RegisterRequest:
    properties:
      account:
        type: string
      birthday:
        type: string
      email:
        type: string
      name:
        type: string
      nickname:
        type: string
      password:
        type: string
    type: object
  models.User:
    properties:
      account:
        type: string
      avatar_url:
        description: GitHub avatar URL.
        type: string
      bio:
        description: Optional profile bio.
        type: string
      birthday:
        type: string
      email:
        type: string
      github_id:
        description: GitHub user ID.
        type: integer
      github_url:
        description: GitHub profile URL.
        type: string
      id:
        type: integer
      name:
        type: string
      nickname:
        type: string
      password:
        type: string
    type: object
  models.VisitLog:
    properties:
      content:
        type: string
      created_at:
        $ref: '#/definitions/models.CustomTime'
      id:
        type: integer
      user_nickname:
        type: string
      visit_time:
        $ref: '#/definitions/models.CustomTime'
    required:
    - visit_time
    type: object
  repository.HotTag:
    properties:
      count:
        type: integer
      name:
        type: string
    type: object
  response.APIResponse:
    properties:
      code:
        type: integer
      data: {}
      msg:
        type: string
      page:
        type: integer
      total:
        type: integer
    type: object
info:
  contact: {}
paths:
  /ai/chat:
    post:
      consumes:
      - application/json
      description: Proxy a DeepSeek Chat Completions request without exposing the
        API key to the frontend.
      parameters:
      - description: Chat request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.ChatRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.APIResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/response.APIResponse'
        "500":
          description: Server error
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - ApiKeyAuth: []
      summary: Proxy DeepSeek chat
      tags:
      - ai
  /auth/github:
    get:
      description: Returns the GitHub OAuth authorization URL.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get GitHub login URL
      tags:
      - auth
  /auth/github/callback:
    get:
      description: Exchanges the GitHub authorization code, loads the GitHub user,
        and signs the user in.
      parameters:
      - description: GitHub authorization code
        in: query
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Missing authorization code
          schema:
            type: string
        "500":
          description: GitHub login failed
          schema:
            type: string
      summary: Handle GitHub OAuth callback
      tags:
      - auth
  /auth/github/login:
    post:
      consumes:
      - application/json
      description: Accepts a GitHub authorization code from the frontend and completes
        the login flow.
      parameters:
      - description: JSON payload containing a GitHub authorization code
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request body
          schema:
            type: string
        "500":
          description: GitHub login failed
          schema:
            type: string
      summary: Sign in with a GitHub code
      tags:
      - auth
  /auth/verify:
    get:
      description: Validates the JWT token and returns the current authenticated user
        information.
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  type: object
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.APIResponse'
      summary: Verify a JWT token
      tags:
      - auth
  /blogs:
    get:
      description: Returns paginated article nodes from categories(type=article),
        with optional parent category and keyword filters.
      parameters:
      - description: Parent category ID used to filter article nodes
        in: query
        name: category_id
        type: integer
      - description: Keyword matched against article titles
        in: query
        name: keyword
        type: string
      - description: Page number, default 1
        in: query
        name: page
        type: integer
      - description: Page size, default 10
        in: query
        name: pagesize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.Blog'
                  type: array
              type: object
        "500":
          description: Query failed
          schema:
            $ref: '#/definitions/response.APIResponse'
      summary: List article-backed blogs
      tags:
      - blogs
  /blogs/{id}:
    get:
      description: Returns a single article node from categories(type=article) while
        preserving the blog response shape.
      parameters:
      - description: Article node ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.Blog'
              type: object
        "400":
          description: Invalid ID
          schema:
            $ref: '#/definitions/response.APIResponse'
        "404":
          description: Blog not found
          schema:
            $ref: '#/definitions/response.APIResponse'
        "500":
          description: Query failed
          schema:
            $ref: '#/definitions/response.APIResponse'
      summary: Get article-backed blog detail
      tags:
      - blogs
  /categories:
    get:
      description: List categories with optional tree mode and pagination.
      parameters:
      - description: Return tree structure, default true
        in: query
        name: tree
        type: boolean
      - description: Parent category ID
        in: query
        name: parent_id
        type: integer
      - description: 'Category type filter: folder or article'
        in: query
        name: type
        type: string
      - description: Category name keyword
        in: query
        name: keyword
        type: string
      - description: Page number starting from 1
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.Category'
                  type: array
              type: object
        "500":
          description: Query failed
          schema:
            $ref: '#/definitions/response.APIResponse'
      summary: List categories
      tags:
      - categories
    post:
      consumes:
      - application/json
      description: Create a new category or nested child category.
      parameters:
      - description: Category payload
        in: body
        name: category
        required: true
        schema:
          $ref: '#/definitions/models.Category'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.Category'
              type: object
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/response.APIResponse'
        "500":
          description: Create failed
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - ApiKeyAuth: []
      summary: Create category
      tags:
      - categories
  /categories/{id}:
    delete:
      description: Delete a category and its descendants.
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.APIResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/response.APIResponse'
        "404":
          description: Category not found
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - ApiKeyAuth: []
      summary: Delete category
      tags:
      - categories
    get:
      description: Get a category and its nested children by ID.
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.Category'
              type: object
        "400":
          description: Invalid ID
          schema:
            $ref: '#/definitions/response.APIResponse'
        "404":
          description: Category not found
          schema:
            $ref: '#/definitions/response.APIResponse'
      summary: Get category detail
      tags:
      - categories
    put:
      consumes:
      - application/json
      description: Update category fields.
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: integer
      - description: Category payload
        in: body
        name: category
        required: true
        schema:
          $ref: '#/definitions/models.Category'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.Category'
              type: object
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/response.APIResponse'
        "404":
          description: Category not found
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - ApiKeyAuth: []
      summary: Update category
      tags:
      - categories
  /categories/hot-tags:
    get:
      description: Get the most frequently used tags.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/repository.HotTag'
                  type: array
              type: object
        "500":
          description: Query failed
          schema:
            $ref: '#/definitions/response.APIResponse'
      summary: Get hot tags
      tags:
      - categories
  /comments:
    get:
      description: Get paginated root comments and nested replies for an article.
      parameters:
      - description: Article ID
        in: query
        name: article_id
        required: true
        type: integer
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.APIResponse'
      summary: List article comments
      tags:
      - comments
    post:
      consumes:
      - application/json
      description: Create a comment or reply for an article.
      parameters:
      - description: Comment payload
        in: body
        name: comment
        required: true
        schema:
          $ref: '#/definitions/models.CreateCommentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - ApiKeyAuth: []
      summary: Create comment
      tags:
      - comments
  /comments/{id}:
    delete:
      description: Delete a comment by ID.
      parameters:
      - description: Comment ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - ApiKeyAuth: []
      summary: Delete comment
      tags:
      - comments
  /github/repos:
    get:
      description: Returns public, non-fork repositories owned by the configured GitHub
        account.
      parameters:
      - default: updated
        description: 'Sort mode: created, updated, pushed, full_name'
        in: query
        name: sort
        type: string
      - default: 30
        description: Page size
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/handler.GitHubRepo'
                  type: array
              type: object
      summary: List the owner's public GitHub repositories
      tags:
      - github
  /guest:
    post:
      consumes:
      - application/json
      description: Records a guest entry event.
      parameters:
      - description: Guest record payload
        in: body
        name: record
        required: true
        schema:
          $ref: '#/definitions/models.GuestRecord'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.GuestRecord'
              type: object
      summary: Create guest record
      tags:
      - guest
  /login:
    post:
      consumes:
      - application/json
      description: Validates account or email credentials and returns a JWT plus user
        information.
      parameters:
      - description: Login credentials
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/models.AuthCredentials'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.AuthResponse'
        "400":
          description: Invalid request body
          schema:
            type: string
        "401":
          description: Invalid credentials
          schema:
            type: string
      summary: Login with account or email
      tags:
      - auth
  /owner/today-visits:
    get:
      description: Returns today's visit count for the owner.
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  type: object
              type: object
      security:
      - ApiKeyAuth: []
      summary: Get owner today visits
      tags:
      - owner
  /owner/visits:
    get:
      description: Returns visit stats for the owner over the last N days.
      parameters:
      - description: Number of days, default 7
        in: query
        name: days
        type: integer
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  type: object
              type: object
      security:
      - ApiKeyAuth: []
      summary: Get owner visit stats
      tags:
      - owner
  /register:
    post:
      consumes:
      - application/json
      description: Creates a new public user account and immediately returns a JWT
        for the new user.
      parameters:
      - description: Registration payload
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/models.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.AuthResponse'
        "400":
          description: Invalid request body
          schema:
            type: string
        "409":
          description: Email or account already exists
          schema:
            type: string
      summary: Register a public user
      tags:
      - auth
  /upload:
    post:
      consumes:
      - multipart/form-data
      description: Upload an image to the remote image host and forward its response.
      parameters:
      - description: Image file
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: object
            type: array
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/response.APIResponse'
        "500":
          description: Upload failed
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - ApiKeyAuth: []
      summary: Proxy image upload
      tags:
      - upload
  /users:
    get:
      description: Returns all registered users.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.User'
            type: array
        "500":
          description: Query failed
          schema:
            type: string
      summary: List users
      tags:
      - users
    post:
      consumes:
      - application/json
      description: Creates a new user record. This endpoint requires owner authentication.
      parameters:
      - description: User payload
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/models.User'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.User'
        "400":
          description: Invalid request body
          schema:
            type: string
        "500":
          description: Create failed
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Add a user
      tags:
      - users
  /visits:
    get:
      description: Returns paginated visit logs.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.VisitLog'
                  type: array
              type: object
      summary: List visit logs
      tags:
      - visits
    post:
      consumes:
      - application/json
      description: Records a user visit.
      parameters:
      - description: Visit payload
        in: body
        name: visit
        required: true
        schema:
          $ref: '#/definitions/models.VisitLog'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.VisitLog'
              type: object
      summary: Create visit log
      tags:
      - visits
  /ws:
    get:
      description: |-
        将 HTTP 连接升级为 WebSocket 长连接，支持 JWT 认证（URL 参数 ?token=xxx 或 Authorization Header）。
        认证用户可订阅频道接收实时推送，匿名用户以访客身份连接。
        客户端连接后应发送 subscribe 消息订阅频道：
        - {"type":"subscribe","channel":"global"} 全局通知
        - {"type":"subscribe","channel":"comments:<id>"} 文章评论
        - {"type":"subscribe","channel":"visits"} 实时访客
      parameters:
      - description: JWT token（可选，用于认证连接）
        in: query
        name: token
        type: string
      produces:
      - application/json
      responses:
        "101":
          description: Switching Protocols - WebSocket 升级成功
      summary: WebSocket 连接端点
      tags:
      - websocket
  /ws/online:
    get:
      description: 返回当前活跃的 WebSocket 连接数量，用于前端展示实时在线人数
      produces:
      - application/json
      responses:
        "200":
          description: 在线人数统计
