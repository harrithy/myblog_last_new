                img_url: document.getElementById('modalCategoryImgUrl').value.trim(),
                description: document.getElementById('modalCategoryDescription').value.trim(),
                tags: modalTags.length > 0 ? modalTags : [],
                sort_order: parseInt(document.getElementById('modalSortOrder').value) || 0
            };
            
            if (category.parent_id) {
                data.parent_id = category.parent_id;
            }
            
            try {
                const response = await fetch(`${API_BASE}/api/categories/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (result.code === 200 || response.ok) {
                    showToast('更新成功', 'success');
                    closeEditModal();
                    loadCategories();
                } else {
                    showToast(result.msg || result.message || '更新失败', 'error');
                }
            } catch (error) {
                console.error('更新失败:', error);
                showToast('更新失败，请重试', 'error');
            }
        });

        // 删除分类
        async function deleteCategory(id) {
            if (!confirm('确定要删除这个分类吗？子分类也会被一并删除！')) {
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/api/categories/${id}`, {
                    method: 'DELETE'
                });
                
                const result = await response.json();
                
                if (result.code === 200 || response.ok) {
                    showToast('删除成功', 'success');
                    loadCategories();
                } else {
                    showToast(result.msg || result.message || '删除失败', 'error');
                }
            } catch (error) {
                console.error('删除失败:', error);
                showToast('删除失败，请重试', 'error');
            }
        }

        // 取消编辑模式
        function cancelEdit() {
            resetForm();
        }

        // 重置表单
        function resetForm() {
            document.getElementById('editingId').value = '';
            document.getElementById('categoryName').value = '';
            document.getElementById('categoryUrl').value = '';
            document.getElementById('categoryImgUrl').value = '';
            document.getElementById('categoryDescription').value = '';
            document.getElementById('imgPreview').innerHTML = '';
            document.getElementById('mdPreview').innerHTML = '';
            document.getElementById('sortOrder').value = '0';
            document.getElementById('parentCategory').value = '';
            
            // 重置标签
            formTags.length = 0;
            formTagsInput.renderTags();
            
            // 重置类型选择
            document.querySelectorAll('.type-option').forEach(o => o.classList.remove('active'));
            document.querySelector('.type-option[data-type="folder"]').classList.add('active');
            document.getElementById('categoryType').value = 'folder';
            document.getElementById('urlField').classList.remove('show');
            
            // 更新UI
            document.getElementById('formTitle').textContent = '创建分类';
            document.getElementById('submitBtn').innerHTML = '<span>创建分类</span>';
            document.getElementById('editModeIndicator').classList.add('hidden');
        }

        // 创建分类
        document.getElementById('categoryForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const editingId = document.getElementById('editingId').value;
            const name = document.getElementById('categoryName').value.trim();
            const type = document.getElementById('categoryType').value;
            const url = document.getElementById('categoryUrl').value.trim();
            const parentId = document.getElementById('parentCategory').value;
            const sortOrder = parseInt(document.getElementById('sortOrder').value) || 0;
            const imgUrl = document.getElementById('categoryImgUrl').value.trim();
            const description = document.getElementById('categoryDescription').value.trim();
            
            if (!name) {
                showToast('请输入分类名称', 'error');
                return;
            }
            
            const data = {
                name: name,
                type: type,
                sort_order: sortOrder
            };
            
            if (type === 'article' && url) {
                data.url = url;
            }
            
            if (imgUrl) {
                data.img_url = imgUrl;
            }

            if (description) {
                data.description = description;
            }

            if (formTags.length > 0) {
                data.tags = formTags;
            }
            
            if (parentId) {
                data.parent_id = parseInt(parentId);
            }
            
            const isEdit = !!editingId;
            const apiUrl = isEdit ? `${API_BASE}/api/categories/${editingId}` : `${API_BASE}/api/categories`;
            const method = isEdit ? 'PUT' : 'POST';
            
            try {
                const response = await fetch(apiUrl, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (result.code === 200 || response.status === 201 || response.ok) {
                    showToast(isEdit ? '更新成功' : '创建成功', 'success');
                    resetForm();
                    loadCategories();
                } else {
                    showToast(result.msg || result.message || (isEdit ? '更新失败' : '创建失败'), 'error');
                }
            } catch (error) {
                console.error('操作失败:', error);
                showToast('操作失败，请重试', 'error');
            }
        });

        // 通用上传函数
        async function uploadFile(file, onSuccess, onError) {
            const formData = new FormData();
            formData.append('file', file);
            
            try {
                const response = await fetch(`${API_BASE}/api/upload`, {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                if (result && result.length > 0 && result[0].src) {
                    onSuccess(IMG_HOST + result[0].src, result[0]);
                } else {
                    onError('上传返回数据异常');
                }
            } catch (error) {
                onError(error.message);
            }
        }

        // 图片上传
        document.getElementById('imgFileInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            const uploadBtn = document.getElementById('imgUploadBtn');
            const uploadBtnText = uploadBtn.querySelector('span');
            const originalText = uploadBtnText ? uploadBtnText.textContent : '上传图片';
            if (uploadBtnText) uploadBtnText.textContent = '上传中...';
            uploadBtn.classList.add('uploading');
            
            await uploadFile(file, 
                (url) => {
                    document.getElementById('categoryImgUrl').value = url;
                    document.getElementById('imgPreview').innerHTML = `
                        <div class="preview-item">
                            <img src="${url}" alt="预览">
                            <button class="remove-btn" onclick="clearImgPreview()">×</button>
                        </div>
                    `;
                    showToast('图片上传成功', 'success');
                },
                (error) => {
                    console.error('上传失败:', error);
                    showToast('图片上传失败，请重试', 'error');
                }
            );
            
            if (uploadBtnText) uploadBtnText.textContent = originalText;
            uploadBtn.classList.remove('uploading');
            e.target.value = '';
        });

        // MD文件上传
        document.getElementById('mdFileInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            const uploadBtn = document.getElementById('mdUploadBtn');
            const uploadBtnText = uploadBtn.querySelector('span');
            const originalText = uploadBtnText ? uploadBtnText.textContent : '上传MD';
            if (uploadBtnText) uploadBtnText.textContent = '上传中...';
            uploadBtn.classList.add('uploading');
            
            await uploadFile(file, 
                (url, data) => {
                    document.getElementById('categoryUrl').value = url;
                    document.getElementById('mdPreview').innerHTML = `
                        <div class="preview-item">
                            <div class="file-info">
                                <span class="preview-icon">${ICONS.file}</span>
                                <span>${escapeHtml(file.name)}</span>
                            </div>
                            <button class="remove-btn" onclick="clearMdPreview()">×</button>
                        </div>
                    `;
                    showToast('MD文件上传成功', 'success');
                },
                (error) => {
                    console.error('上传失败:', error);
                    showToast('MD文件上传失败，请重试', 'error');
                }
            );
            
            if (uploadBtnText) uploadBtnText.textContent = originalText;
            uploadBtn.classList.remove('uploading');
            e.target.value = '';
        });

        // 清除预览
        function clearImgPreview() {
            document.getElementById('categoryImgUrl').value = '';
            document.getElementById('imgPreview').innerHTML = '';
        }

        function clearMdPreview() {
            document.getElementById('categoryUrl').value = '';
            document.getElementById('mdPreview').innerHTML = '';
        }

        // 手动输入URL时显示预览
        document.getElementById('categoryImgUrl').addEventListener('blur', (e) => {
            const url = e.target.value.trim();
            if (url && !document.getElementById('imgPreview').innerHTML) {
                document.getElementById('imgPreview').innerHTML = `
                    <div class="preview-item">
                        <img src="${url}" alt="预览" onerror="this.parentElement.innerHTML='<div class=\\'file-info\\'>图片加载失败</div>'">
                    </div>
                `;
            } else if (!url) {
                document.getElementById('imgPreview').innerHTML = '';
            }
        });

        // HTML转义
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 属性转义
        function escapeAttr(text) {
            return text.replace(/'/g, "\\'").replace(/"/g, '\\"');
        }

        // 点击弹窗外部关闭
        document.getElementById('editModal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) {
                closeEditModal();
            }
        });

        // ESC关闭弹窗
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeEditModal();
            }
        });

        // 页面加载时获取分类列表
        document.addEventListener('DOMContentLoaded', loadCategories);
    </script>
</body>
</html>
